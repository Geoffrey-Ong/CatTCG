<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat TCG — Battle Owners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#221A12',
                        voidDeep: '#170F0A',
                        voidRaised: '#2E2318',
                        beige: '#EFE3CB',
                        beigeDeep: '#E4D5B0',
                        ink: '#2B2018',
                        inkSoft: '#7A6A54',
                        orange: '#E8963D',
                        orangeLight: '#F5B66B',
                        rarityCommon: '#9C8F76',
                        rarityUncommon: '#6FA37A',
                        rarityRare: '#5D8FC2',
                        rarityEpic: '#B36FBF',
                        rarityLegendary: '#E8963D',
                    },
                    fontFamily: {
                        display: ['"Baloo 2"', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="custom.css">
</head>

<body class="bg-void text-beige font-body min-h-screen">
    <header id="siteHeader" class="bg-voidDeep border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-[1100px] mx-auto px-6 py-4 flex items-center gap-8">
            <a href="index.html" class="flex items-center gap-2 font-display font-bold text-xl mr-auto text-beige no-underline">
                <span class="text-2xl">🐾</span> Cat TCG
            </a>
            <nav class="flex gap-2">
                <a href="index.html" class="px-3.5 py-2 rounded-full font-semibold text-sm text-inkSoft hover:text-beige hover:bg-white/5 no-underline transition">Home</a>
                <a href="battle.html" class="px-3.5 py-2 rounded-full font-semibold text-sm bg-orange text-voidDeep no-underline">Battle Owners</a>
            </nav>
            <div id="apiStatus" class="flex items-center gap-2 text-xs text-inkSoft" title="Checking…">
                <span id="apiStatusLed" class="status-led checking"></span>
                <span id="apiStatusLabel" class="hidden sm:inline">Checking…</span>
            </div>
        </div>
    </header>

    <main id="battleLobby" class="max-w-[1100px] mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-10 items-start">
        <!-- BOSSES -->
        <section>
            <h1 class="font-display text-3xl font-bold mb-6">Bosses:</h1>
            <div id="bossList" class="flex flex-col gap-4"></div>
        </section>

        <!-- YOUR TEAM -->
        <section>
            <div class="flex items-center justify-between mb-3">
                <p class="font-display font-bold text-lg">Your team</p>
                <button type="button" onclick="openTeamPicker()" class="px-4 py-2 rounded-full bg-voidRaised border border-white/10 font-semibold text-sm hover:bg-white/5 transition">Change</button>
            </div>
            <div id="teamSlots" class="flex flex-col gap-4"></div>
        </section>
    </main>

    <!-- BATTLE SCREEN (hidden until a fight starts) -->
    <section id="battleScreen" class="hidden max-w-[1000px] mx-auto px-6 py-6">
        <!-- EXIT + OWNER HP -->
        <div class="flex items-center gap-4 mb-5">
            <button type="button" onclick="handleExitBattle()" class="shrink-0 px-3.5 py-2 rounded-full bg-voidRaised border border-white/10 font-semibold text-sm hover:bg-white/5 transition">&larr; Exit</button>
            <div class="flex-1">
                <div class="flex items-center justify-between text-xs font-bold text-inkSoft mb-1">
                    <span id="ownerNameLabel"></span>
                    <span id="ownerHpLabel">HP 0/0</span>
                </div>
                <div class="w-full h-3 rounded-full bg-voidRaised overflow-hidden">
                    <div id="ownerHpFill" class="h-full bg-orange transition-all duration-300"></div>
                </div>
                <div id="ownerStatusBadges" class="flex gap-2 mt-1.5"></div>
            </div>
        </div>

        <!-- BATTLEFIELD: bench — active — owner (boss on the right), one row -->
        <div class="flex items-center justify-center flex-wrap gap-4 sm:gap-6 md:gap-8 mb-5">
            <div id="benchList" class="flex gap-2 sm:gap-3"></div>
            <div id="activeFighterCard" class="shrink-0"></div>
            <div id="ownerPortraitWrap" class="relative shrink-0">
                <div id="ownerPortrait" class="w-28 h-28 sm:w-36 sm:h-36 md:w-44 md:h-44 lg:w-52 lg:h-52 rounded-2xl bg-voidRaised border border-white/10 flex items-center justify-center overflow-hidden"></div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="flex flex-col items-center gap-3">
            <div id="swapButtonContainer" class="hidden">
                <button type="button" onclick="handleSwapButtonClick()" class="px-4 py-2 rounded-full bg-voidRaised border border-white/10 font-semibold text-sm hover:bg-white/5 transition">Swap</button>
            </div>
            <div id="moveButtons" class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-md"></div>
        </div>

        <!-- EVENT TOAST (centered, min. read time enforced in JS) -->
        <div id="battleEventToast" class="hidden fixed inset-0 z-[75] items-center justify-center pointer-events-none px-4">
            <div class="bg-beige text-ink font-bold text-sm sm:text-base px-6 py-4 rounded-2xl shadow-xl text-center max-w-sm">
                <span id="battleEventText"></span>
            </div>
        </div>

        <div id="battleOverBanner" class="hidden fixed inset-0 z-[80] items-center justify-center bg-voidDeep/90 px-4">
            <div class="bg-void border border-white/10 rounded-2xl p-8 text-center max-w-sm banner-pop">
                <p id="battleOverTitle" class="font-display text-2xl font-bold mb-2"></p>
                <p id="battleOverSubtitle" class="text-sm text-inkSoft mb-6"></p>
                <button type="button" onclick="endBattle()" class="px-5 py-2.5 rounded-full bg-orange text-voidDeep font-bold text-sm hover:bg-orangeLight transition">Back to Bosses</button>
            </div>
        </div>
    </section>

    <!-- TEAM PICKER MODAL -->
    <div id="teamPickerModal" class="team-picker-overlay fixed inset-0 z-[60] items-center justify-center px-4" onclick="handleTeamPickerOverlayClick(event)">
        <div class="team-picker-card w-full max-w-[640px] max-h-[80vh] overflow-y-auto rounded-2xl bg-void border border-white/10 p-6">
            <div class="flex items-center justify-between mb-1">
                <h2 class="font-display text-xl font-bold">Choose your team</h2>
                <button type="button" onclick="closeTeamPicker()" class="text-inkSoft hover:text-beige text-2xl leading-none" aria-label="Close">&times;</button>
            </div>
            <p class="text-xs text-inkSoft mb-4">
                Tap up to three cats — the order you tap them sets who deploys first. Tap a selected cat again to remove it.
            </p>
            <div id="teamPickerGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
        </div>
    </div>

    <!-- CARD DETAIL MODAL -->
    <div id="cardDetailModal" class="detail-modal-overlay fixed inset-0 z-[70] items-center justify-center px-4" onclick="handleDetailOverlayClick(event)">
        <div id="detailModalContent" class="detail-modal-card w-full max-w-[320px]"></div>
    </div>

    <script src="cards.js"></script>
    <script src="owners.js"></script>
    <script src="shared.js"></script>
    <script src="battle-engine.js"></script>
    <script src="battle.js"></script>
    <script src="audio.js"></script>
</body>

</html>
