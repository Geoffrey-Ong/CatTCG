<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat TCG — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#221A12',
                        voidDeep: '#170F0A',
                        voidRaised: '#2E2318',
                        beige: '#EFE3CB',
                        beigeDeep: '#E4D5B0',
                        ink: '#2B2018',
                        inkSoft: '#7A6A54',
                        orange: '#E8963D',
                        orangeLight: '#F5B66B',
                        rarityCommon: '#9C8F76',
                        rarityUncommon: '#6FA37A',
                        rarityRare: '#5D8FC2',
                        rarityEpic: '#B36FBF',
                        rarityLegendary: '#E8963D',
                    },
                    fontFamily: {
                        display: ['"Baloo 2"', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="custom.css">
</head>

<body class="bg-void text-beige font-body min-h-screen">
    <header class="bg-voidDeep border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-[1100px] mx-auto px-6 py-4 flex items-center gap-8">
            <a href="index.html" class="flex items-center gap-2 font-display font-bold text-xl mr-auto text-beige no-underline">
                <span class="text-2xl">🐾</span> Cat TCG
            </a>
            <nav class="flex gap-2">
                <a href="index.html" class="px-3.5 py-2 rounded-full font-semibold text-sm bg-orange text-voidDeep no-underline">Home</a>
                <a href="collection.html" class="px-3.5 py-2 rounded-full font-semibold text-sm text-inkSoft hover:text-beige hover:bg-white/5 no-underline transition">Collection</a>
                <a href="inventory.html" class="px-3.5 py-2 rounded-full font-semibold text-sm text-inkSoft hover:text-beige hover:bg-white/5 no-underline transition">Inventory</a>
                <a href="battle.html" class="px-3.5 py-2 rounded-full font-semibold text-sm text-inkSoft hover:text-beige hover:bg-white/5 no-underline transition">Battle Owners</a>
            </nav>
        </div>
    </header>

    <section class="max-w-[720px] mx-auto text-center px-6 pt-14 pb-8">
        <p class="text-inkSoft mb-1">Welcome back</p>
        <h1 class="font-display text-4xl font-bold mb-6">Your Cats</h1>
        <button id="openPackButton" class="font-display text-lg font-bold px-9 py-4 rounded-2xl bg-gradient-to-br from-orange to-orangeLight text-voidDeep shadow-lg shadow-orange/30 hover:-translate-y-0.5 transition">
            Open a Pack
        </button>
    </section>

    <section class="marquee-wrap py-6">
        <div id="marqueeTrack" class="marquee-track"></div>
    </section>

    <footer class="text-center py-8 text-inkSoft text-sm border-t border-white/10">
        <p>Cards are generated from the Simple Cat API. Stats and rarities are for fun, not official science.</p>
    </footer>

    <!-- PACK OPENING MODAL -->
    <div id="packModal" class="pack-modal-overlay fixed inset-0 flex-col items-center justify-center gap-6 p-5 z-[1000]" onclick="handlePackOverlayClick(event)">
        <div class="pack-reveal">
            <div class="reveal-card-inner" id="revealCardInner" onclick="flipRevealCard()">
                <div class="reveal-card-flipper" id="revealCardFlipper">
                    <div class="reveal-face reveal-face-back bg-gradient-to-br from-voidRaised to-voidDeep border-2 border-white/10 items-center justify-center gap-2.5">
                        <span class="text-5xl">🐾</span>
                        <p class="text-inkSoft text-sm">Tap to reveal</p>
                    </div>
                    <div class="reveal-face reveal-face-front" id="revealCardFront"></div>
                </div>
            </div>
        </div>
        <p class="text-inkSoft text-sm" id="packModalHint">Tap the card to open it</p>
        <button class="font-semibold px-6 py-2.5 rounded-xl border border-white/10 text-beige hover:bg-white/10 transition" onclick="closePackModal()">Close</button>
    </div>

    <!-- CARD DETAIL MODAL -->
    <div id="cardDetailModal" class="detail-modal-overlay fixed inset-0 items-center justify-center p-5 z-[1000]" onclick="handleDetailOverlayClick(event)">
        <div class="detail-modal-card relative bg-beige text-ink rounded-2xl p-8 max-w-[620px] w-full max-h-[85vh] overflow-y-auto shadow-2xl">
            <button class="absolute top-3.5 left-3.5 w-8 h-8 rounded-full bg-ink text-beige hover:bg-orange transition" onclick="closeDetailModal()" aria-label="Close">✕</button>
            <div id="detailModalContent"></div>
        </div>
    </div>

    <script src="cards.js"></script>
    <script src="shared.js"></script>
    <script src="app.js"></script>
</body>

</html>
