<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cat TCG — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#221A12',
                        voidDeep: '#170F0A',
                        voidRaised: '#2E2318',
                        beige: '#EFE3CB',
                        beigeDeep: '#E4D5B0',
                        ink: '#2B2018',
                        inkSoft: '#7A6A54',
                        orange: '#E8963D',
                        orangeLight: '#F5B66B',
                        rarityCommon: '#9C8F76',
                        rarityUncommon: '#6FA37A',
                        rarityRare: '#5D8FC2',
                        rarityEpic: '#B36FBF',
                        rarityLegendary: '#E8963D',
                    },
                    fontFamily: {
                        display: ['"Baloo 2"', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="custom.css">
</head>

<body class="bg-void text-beige font-body min-h-screen pb-[calc(5rem+env(safe-area-inset-bottom))] md:pb-0">
    <header class="bg-voidDeep border-b border-white/10 sticky top-0 z-50 shadow-lg shadow-black/20">
        <div class="max-w-[1100px] mx-auto px-4 md:px-6 py-3 md:py-4 flex items-center gap-4 md:gap-8">
            <a href="index.html" class="flex items-center gap-2 font-display font-bold text-xl mr-auto text-beige no-underline">
                <span class="text-2xl">🐾</span> Cat TCG
            </a>

            <!-- Bottom tab bar on phones, top pill nav from md (768px) up -->
            <nav class="fixed bottom-0 inset-x-0 z-50 flex bg-voidDeep border-t border-white/10 pb-[env(safe-area-inset-bottom)]
                        md:static md:z-auto md:bg-transparent md:border-0 md:pb-0 md:gap-2">
                <a href="index.html" class="flex flex-col md:flex-row items-center justify-center gap-0.5 md:gap-2 flex-1 md:flex-none py-2.5 md:px-3.5 md:py-2 md:rounded-full font-semibold text-xs md:text-sm no-underline transition text-orange md:bg-orange md:text-voidDeep">
                    <span class="text-xl md:hidden" aria-hidden="true">🏠</span>Home
                </a>
                <a href="battle.html" class="flex flex-col md:flex-row items-center justify-center gap-0.5 md:gap-2 flex-1 md:flex-none py-2.5 md:px-3.5 md:py-2 md:rounded-full font-semibold text-xs md:text-sm no-underline transition text-inkSoft hover:text-beige md:hover:bg-white/5">
                    <span class="text-xl md:hidden" aria-hidden="true">⚔️</span>Battle Owners
                </a>
            </nav>

            <div id="apiStatus" class="flex items-center gap-2 text-xs text-inkSoft" title="Checking…">
                <span id="apiStatusLed" class="status-led checking"></span>
                <span id="apiStatusLabel" class="hidden sm:inline">Checking…</span>
            </div>
        </div>
    </header>

    <section class="max-w-[720px] mx-auto text-center px-6 pt-8 md:pt-14 pb-8">
        <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-orange mb-2">Welcome back</p>
        <h1 class="font-display text-4xl font-bold mb-3 drop-shadow-sm">Your Cats</h1>
        <span class="block mx-auto mb-6 h-1 w-14 rounded-full bg-gradient-to-r from-orange to-orangeLight"></span>
        <button id="openPackButton" class="btn-press btn-sheen font-display text-lg font-bold px-9 py-4 rounded-2xl bg-gradient-to-br from-orange to-orangeLight text-voidDeep shadow-lg shadow-orange/30 hover:shadow-xl hover:shadow-orange/50 hover:-translate-y-0.5 transition">
            Open a Pack
        </button>
    </section>

    <section class="marquee-wrap py-6">
        <div id="marqueeTrack" class="marquee-track"></div>
    </section>

    <section class="max-w-[640px] mx-auto text-center px-6 pt-8 md:pt-14 pb-10">
        <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-orange mb-2">Your Collection</p>
        <p class="font-display text-6xl font-bold mb-5">
            <span id="unlockedCount">0</span><span class="text-inkSoft"> / </span><span id="totalCount">0</span>
        </p>
        <div class="h-2.5 rounded-full bg-voidRaised overflow-hidden mb-2">
            <div id="progressFill" class="h-full bg-gradient-to-r from-orange to-orangeLight rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(232,150,61,0.5)]" style="width: 0%"></div>
        </div>
        <p class="text-inkSoft text-sm">Keep opening packs to find what you're missing</p>
        <div id="rarityBreakdown" class="flex flex-wrap justify-center gap-2.5 mt-8"></div>
    </section>

    <main class="max-w-[1100px] mx-auto px-4 md:px-6 pb-16">
        <div id="cardGrid" class="grid grid-cols-[repeat(auto-fill,minmax(140px,1fr))] gap-3 md:gap-[18px]">Loading cats...</div>
    </main>

    <footer class="text-center py-8 text-inkSoft text-sm border-t border-white/10">
        <p>Cards are generated from the Simple Cat API. Stats and rarities are for fun, not official science.</p>
    </footer>

    <div id="packModal" class="pack-modal-overlay backdrop-blur-sm fixed inset-0 flex-col items-center justify-center gap-6 p-5 z-[1000]" onclick="handlePackOverlayClick(event)">
        <div class="pack-reveal">
            <div class="reveal-card-inner" id="revealCardInner" onclick="flipRevealCard()">
                <div class="reveal-card-flipper" id="revealCardFlipper">
                    <div class="reveal-face reveal-face-back bg-gradient-to-br from-voidRaised to-voidDeep border-2 border-white/10 items-center justify-center gap-2.5">
                        <span class="text-5xl">🐾</span>
                        <p class="text-inkSoft text-sm">Tap to reveal</p>
                    </div>
                    <div class="reveal-face reveal-face-front" id="revealCardFront"></div>
                </div>
            </div>
        </div>
        <p class="text-inkSoft text-sm" id="packModalHint">Tap the card to open it</p>
        <button class="btn-press font-semibold px-6 py-2.5 rounded-xl border border-white/10 text-beige hover:bg-white/10 hover:shadow-md transition" onclick="closePackModal()">Close</button>
    </div>

    <div id="cardDetailModal" class="detail-modal-overlay backdrop-blur-sm fixed inset-0 flex-col overflow-y-auto p-5 z-[1000]" onclick="handleDetailOverlayClick(event)">
        <!-- m-auto centers the card when it fits and lets the overlay scroll when it doesn't -->
        <div class="detail-modal-card m-auto w-full max-w-[360px] flex flex-col items-center gap-4">
            <div id="detailModalContent" class="w-full pt-3"></div>
            <button class="btn-press font-semibold px-6 py-2.5 rounded-xl border border-white/10 text-beige hover:bg-white/10 hover:shadow-md transition" onclick="closeDetailModal()">Close</button>
        </div>
    </div>

    <script src="cards.js"></script>
    <script src="shared.js"></script>
    <script src="audio.js"></script>
    <script src="app.js"></script>
</body>

</html>
