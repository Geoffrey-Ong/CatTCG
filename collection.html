<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat TCG — Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#221A12',
                        voidDeep: '#170F0A',
                        voidRaised: '#2E2318',
                        beige: '#EFE3CB',
                        beigeDeep: '#E4D5B0',
                        ink: '#2B2018',
                        inkSoft: '#7A6A54',
                        orange: '#E8963D',
                        orangeLight: '#F5B66B',
                        rarityCommon: '#9C8F76',
                        rarityUncommon: '#6FA37A',
                        rarityRare: '#5D8FC2',
                        rarityEpic: '#B36FBF',
                        rarityLegendary: '#E8963D',
                    },
                    fontFamily: {
                        display: ['"Baloo 2"', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="custom.css">
</head>

<body class="bg-void text-beige font-body min-h-screen">
    <header class="bg-voidDeep border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-[1100px] mx-auto px-6 py-4 flex items-center gap-8">
            <a href="index.html" class="flex items-center gap-2 font-display font-bold text-xl mr-auto text-beige no-underline">
                <span class="text-2xl">🐾</span> Cat TCG
            </a>
            <nav class="flex gap-2">
                <a href="index.html" class="px-3.5 py-2 rounded-full font-semibold text-sm text-inkSoft hover:text-beige hover:bg-white/5 no-underline transition">Home</a>
                <a href="collection.html" class="px-3.5 py-2 rounded-full font-semibold text-sm bg-orange text-voidDeep no-underline">Collection</a>
                <a href="inventory.html" class="px-3.5 py-2 rounded-full font-semibold text-sm text-inkSoft hover:text-beige hover:bg-white/5 no-underline transition">Inventory</a>
                <a href="battle.html" class="px-3.5 py-2 rounded-full font-semibold text-sm text-inkSoft hover:text-beige hover:bg-white/5 no-underline transition">Battle Owners</a>
            </nav>
        </div>
    </header>

    <section class="max-w-[640px] mx-auto text-center px-6 pt-14 pb-10">
        <p class="text-inkSoft mb-1">Your Collection</p>
        <p class="font-display text-6xl font-bold mb-5">
            <span id="unlockedCount">0</span><span class="text-inkSoft"> / </span><span id="totalCount">0</span>
        </p>
        <div class="h-2.5 rounded-full bg-voidRaised overflow-hidden mb-2">
            <div id="progressFill" class="h-full bg-gradient-to-r from-orange to-orangeLight rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <p class="text-inkSoft text-sm">Keep opening packs to find what you're missing</p>
    </section>

    <main class="max-w-[1100px] mx-auto px-6 pb-16">
        <div id="cardGrid" class="grid grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-[18px]">Loading cats...</div>
    </main>

    <footer class="text-center py-8 text-inkSoft text-sm border-t border-white/10">
        <p>Cards are generated from the Simple Cat API. Stats and rarities are for fun, not official science.</p>
    </footer>

    <!-- CARD DETAIL MODAL -->
    <div id="cardDetailModal" class="detail-modal-overlay fixed inset-0 items-center justify-center p-5 z-[1000]" onclick="handleDetailOverlayClick(event)">
        <div class="detail-modal-card relative bg-beige text-ink rounded-2xl p-8 max-w-[620px] w-full max-h-[85vh] overflow-y-auto shadow-2xl">
            <button class="absolute top-3.5 left-3.5 w-8 h-8 rounded-full bg-ink text-beige hover:bg-orange transition" onclick="closeDetailModal()" aria-label="Close">✕</button>
            <div id="detailModalContent"></div>
        </div>
    </div>

    <script src="cards.js"></script>
    <script src="shared.js"></script>
    <script src="collection.js"></script>
</body>

</html>
